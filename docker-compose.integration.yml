# Docker Compose for local integration testing
#
# Usage:
#   docker-compose -f docker-compose.integration.yml up -d
#   # Run your tests...
#   docker-compose -f docker-compose.integration.yml down -v
#
# This provides the same services as the GitHub Actions workflow:
# - PostgreSQL 15 with pgvector extension
# - Redis 7
# - MinIO (S3-compatible storage)

version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: prpm-integration-postgres
    environment:
      POSTGRES_USER: prpm
      POSTGRES_PASSWORD: prpm
      POSTGRES_DB: prpm_registry
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "prpm"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: prpm-integration-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: prpm-integration-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

  # MinIO client to create bucket on startup
  minio-setup:
    image: minio/mc:latest
    container_name: prpm-integration-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/prpm-packages --ignore-existing;
      echo 'MinIO bucket created';
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
